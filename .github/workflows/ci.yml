name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Upstream drift check. Both CLIs self-update, so this is how we find out
    # the protocol moved from a red build rather than a broken session.
    - cron: '17 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Electron's binary is only needed for packaging, not for typecheck/lint/test.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      # v6, not v4: v4 declares node20, which the runners now force onto node24
      # and warn about — a deprecation that becomes a red build on some future
      # runner image. v5 was the node24 move and v6 added pnpm 11 support, so
      # neither major changes anything this workflow relies on.
      #
      # No `version` input: package.json's `packageManager` field already pins
      # pnpm, and the action reads it. Two places stating one version is a thing
      # to keep in sync, and they drift silently — the check that would catch it
      # is the build that stops matching the lockfile.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

  # Does the suite we already have run on Windows at all?
  #
  # A portability probe, not the release job — Windows support is being built in
  # phases and this is Phase 0's only automated deliverable. It answers one
  # question the plan refused to answer from memory: which of typecheck, lint,
  # format and test survive a platform nobody has run them on.
  #
  # It has been green once, on 2026-08-16, so it blocks like any other job.
  #
  # It carried `continue-on-error` until then, on the condition written here:
  # remove the flag the first time it passes. That first run failed 36 tests and
  # every one was worth having — almost all of them were tests asserting the host
  # they ran on rather than the platform they named, and one was a real bug, a
  # third copy of the `${cwd}/` prefix arithmetic that would have made every
  # recap on Windows report "no files changed".
  #
  # No `shell:` on the steps. Every one is a single `pnpm run` and the runner's
  # default pwsh handles those; the moment a step needs a pipeline or a `$VAR`
  # it needs `shell: bash` stated, because pwsh is not sh.
  check-windows:
    name: Typecheck, lint, test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # See the note in `check` above.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # The lockfile is generated on macOS and installed here unchanged. That is
      # the point: both native deps ship every platform's prebuild inside the
      # one package — node-pty carries `prebuilds/win32-x64`, better-sqlite3 a
      # `win32-x64.node` — so there is nothing platform-resolved to drift. If
      # this step ever fails on the lockfile, that assumption broke.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # The step `.gitattributes` exists for. Without `eol=lf` this fails on
      # every file in the repo, because the checkout above converted them.
      - name: Format
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      # See the note in `check` above.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  # Two different questions, deliberately split.
  #
  # This job asks "do the committed bindings still match the version we pinned?"
  # — i.e. did someone hand-edit generated code. It must always pass.
  bindings-match-pin:
    name: Codex bindings match pinned CLI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the pinned Codex CLI
        run: |
          VERSION="$(cat packages/adapter-codex/src/generated/.codex-version)"
          echo "pinned codex version: $VERSION"
          npm install -g "@openai/codex@$VERSION"

      - name: Regenerate and compare
        run: |
          codex app-server generate-ts --out packages/adapter-codex/src/generated
          codex --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' > packages/adapter-codex/src/generated/.codex-version
          if ! git diff --quiet -- packages/adapter-codex/src/generated; then
            echo "::error::Committed bindings do not match the pinned CLI. Regenerate with:"
            echo "  codex app-server generate-ts --out packages/adapter-codex/src/generated"
            git diff --stat -- packages/adapter-codex/src/generated
            exit 1
          fi

  # This job asks "has the protocol moved upstream?" The app-server is marked
  # [experimental] and its generated types already contradicted the published
  # docs in six places, so a red build here is the signal we want (plan §6.1).
  # It runs on a schedule rather than per-PR, because upstream shipping is not a
  # reason to block a pull request.
  protocol-drift:
    name: Codex protocol drift (upstream)
    if: github.event_name == 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install the latest Codex CLI
        run: npm install -g @openai/codex@latest

      - name: Report drift against the pinned bindings
        run: |
          PINNED="$(cat packages/adapter-codex/src/generated/.codex-version)"
          LATEST="$(codex --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          codex app-server generate-ts --out packages/adapter-codex/src/generated
          if git diff --quiet -- packages/adapter-codex/src/generated; then
            echo "No protocol change between $PINNED and $LATEST."
            exit 0
          fi
          echo "::warning::Codex protocol changed between $PINNED and $LATEST — review before bumping."
          git diff --stat -- packages/adapter-codex/src/generated
          exit 1
