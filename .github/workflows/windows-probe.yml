name: Windows probe

# Run by hand from the Actions tab, or `gh workflow run windows-probe.yml`.
#
# There is no Windows machine here. Everything about that platform is written on
# a Mac and unit-tested by injecting a fake platform, so the questions that
# matter most are the ones only a real Windows filesystem can answer:
#
#   1. What does a machine with **no** CLI installed actually show the user?
#   2. Where does the CLI land once it is installed?
#   3. Does Chorus's own resolver find it there?
#   4. Does the packaged bundle launch?
#
# The order below is the point. A runner is the only empty machine available —
# a developer's Mac lists `~/.local/bin`, `/opt/homebrew/bin` and
# `/usr/local/bin` as static candidates, so a CLI installed in any of them is
# found however `PATH` is trimmed. Everything about the empty state therefore
# has to happen *before* the install step, and once that runs the window is gone.

on:
  workflow_dispatch:

jobs:
  probe:
    name: What an empty machine shows, and where the CLI lands
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Nothing is installed yet
        shell: pwsh
        run: |
          Write-Host "--- where.exe claude (expected: nothing) ---"
          where.exe claude 2>&1 | Out-String
          Write-Host "--- where.exe codex (expected: nothing) ---"
          where.exe codex 2>&1 | Out-String
          # `where.exe` exits 1 when it finds nothing, and the runner's pwsh
          # wrapper fails a step on any non-zero exit. Here "not found" is the
          # expected answer, not a failure.
          exit 0

      - name: Package
        shell: pwsh
        run: pnpm package

      # The one condition that cannot be staged anywhere else: a real machine,
      # the real packaged bundle, and genuinely no CLI. Fails if an agent is
      # reported absent with no advice beside it.
      - name: What Settings shows with no CLI at all
        shell: pwsh
        run: node apps/desktop/e2e/settings-shot.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-no-cli
          path: apps/desktop/release/shots/*.png
          if-no-files-found: warn

      - name: Install the CLI the npm way
        shell: pwsh
        run: npm install -g @anthropic-ai/claude-code

      - name: Where it landed
        shell: pwsh
        run: |
          Write-Host "--- where.exe claude ---"
          where.exe claude 2>&1 | Out-String
          Write-Host "--- %APPDATA%\npm ---"
          if (Test-Path "$env:APPDATA\npm") {
            Get-ChildItem "$env:APPDATA\npm" -Filter "claude*" | Select-Object Name | Out-String
          } else { Write-Host "(no such directory)" }
          Write-Host "--- %USERPROFILE%\.local\bin ---"
          if (Test-Path "$env:USERPROFILE\.local\bin") {
            Get-ChildItem "$env:USERPROFILE\.local\bin" | Select-Object Name | Out-String
          } else { Write-Host "(no such directory)" }
          exit 0

      # The question `command.ts` was fixed on an inference about. This asks the
      # machine instead: given its real filesystem, does the resolver find it?
      - name: Does Chorus's own resolver find it
        shell: pwsh
        env:
          CHORUS_RESOLVE_PROBE: '1'
        run: pnpm --filter @chorus/desktop exec vitest run src/main/resolve-probe.test.ts --reporter verbose

      # `bundle` scope, and the scope is the point.
      #
      # The verifier's full pass waits for a `.pane`, which only exists once a
      # conversation has started — and a conversation needs an *authenticated*
      # agent. No runner has one. Run without this it waits two minutes and
      # reports a packaging fault that is not there; the file says so in a
      # comment, and the first Windows CI run made the same misreading. A later
      # one did too, which is why the variable is set rather than assumed.
      - name: Drive the packaged bundle
        shell: pwsh
        env:
          CHORUS_VERIFY_SCOPE: bundle
        run: pnpm --filter @chorus/desktop run verify:package:windows
