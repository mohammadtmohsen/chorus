name: Release

# One tag, both installers, one release.
#
# This replaces a sequence that was half manual: the DMG was built on the
# maintainer's Mac and uploaded by hand, and the Windows installer had its own
# workflow. Two problems with that, and neither is tidiness.
#
# The first is that a hand-built artifact is built from whatever is in that
# working tree. `pnpm package` reaching for a `dist/` a previous build left
# behind is not a hypothetical — it is the bug the first Windows CI run found,
# and it had been latent for as long as releases had been cut from a machine
# that never started clean.
#
# The second is that "release" meant one platform, so a Windows asset was an
# extra errand nobody would remember.
#
# `workflow_dispatch` builds without publishing, which is how you find out the
# pipeline works without cutting a release to do it.
on:
  workflow_dispatch:
    inputs:
      publish_to:
        description: 'Existing tag to publish to (blank = build only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.publish_to || github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  PUBLISH_TAG: ${{ inputs.publish_to }}

jobs:
  # Nothing is built until the version is coherent and the gate is green.
  #
  # The version check is not ceremony. CLAUDE.md has said for months that the
  # two package.json files "are separate and drift silently", which is a defect
  # description waiting for an enforcement, and a tag that disagrees with them
  # produces an installer whose filename lies about what is inside it.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.publish_to != '' && format('refs/tags/{0}', inputs.publish_to) || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: The tag, the root and the app must agree
        id: version
        shell: bash
        run: |
          ROOT=$(node -p "require('./package.json').version")
          APP=$(node -p "require('./apps/desktop/package.json').version")
          EXTENSION=$(node -p "require('./apps/extension/package.json').version")
          if [ "$ROOT" != "$EXTENSION" ]; then
            echo "::error::package.json says $ROOT, apps/extension/package.json says $EXTENSION"
            exit 1
          fi
          if [ "$ROOT" != "$APP" ]; then
            echo "::error::package.json says $ROOT, apps/desktop says $APP"
            exit 1
          fi
          # Only a real tag has something to disagree with.
          TAG="$PUBLISH_TAG"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -n "$TAG" ] && [ "$TAG" != "v$ROOT" ]; then
            echo "::error::tag $TAG does not match version $ROOT"
            exit 1
          fi
          echo "version=$ROOT" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "building $ROOT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test

  build:
    name: ${{ matrix.label }}
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform failing must not cancel the others. Knowing that Windows
      # built and macOS did not is worth more than one cancelled job.
      fail-fast: false
      matrix:
        # Each job builds exactly one architecture, and the runner matches it.
        #
        # `packageArgs` names the architecture rather than trusting the runner's.
        #
        # It was introduced with a false explanation, and the correction is worth
        # keeping: `electron-builder.yml` used to carry `arch: [arm64, x64]` on
        # the mac target, and **a per-target arch list in the config beats the CLI
        # flag** — so `pnpm package --arm64` cheerfully built both. Found by
        # running it, not by reading it. The `arch` list is gone now, so the flag
        # decides and each job builds exactly one.
        #
        # The Intel build needs an Intel runner because `verify:package` launches
        # the app it just built, and GitHub's arm64 images ship no Rosetta —
        # cross-building x64 on arm64 would package fine and prove nothing, and an
        # unverified artifact that uploads successfully is the failure that looks
        # like a pass.
        #
        # `macos-15-intel`, not `macos-13`. The first run sat queued for
        # twenty-four minutes with no runner ever assigned: the macOS 13 image has
        # been retired, and a label GitHub no longer offers does not fail, it
        # simply never starts.
        include:
          - os: macos-latest
            label: macOS installer (Apple Silicon)
            packageArgs: --arm64
            artifact: Chorus-${{ needs.gate.outputs.version }}-arm64.dmg
            verify: verify:package
          - os: macos-15-intel
            label: macOS installer (Intel)
            packageArgs: --x64
            artifact: Chorus-${{ needs.gate.outputs.version }}-x64.dmg
            verify: verify:package
          - os: windows-latest
            label: Windows installer
            packageArgs: --x64
            artifact: Chorus-${{ needs.gate.outputs.version }}-windows-x64-setup.exe
            verify: verify:package:windows
          # Linux is built on Linux because it has to be, not for symmetry:
          # `node-pty` publishes no Linux prebuild, so its install compiles from
          # source on the build host. Cross-building from macOS would ship a
          # bundle with no PTY and nothing saying so.
          #
          # Two artifacts from one build. `artifact` names the AppImage because
          # the checksum and upload steps take a single name; the `.deb` is
          # collected beside it by `extraArtifact`.
          - os: ubuntu-latest
            label: Linux installers
            packageArgs: --x64
            artifact: Chorus-${{ needs.gate.outputs.version }}-linux-x64.AppImage
            extraArtifact: Chorus-${{ needs.gate.outputs.version }}-linux-x64.deb
            verify: verify:package:linux
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # Electron's own binary is skipped for the gate and needed here.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 0

      # pnpm appends these to the end of the script string, so they land on
      # `electron-builder` rather than on the `electron-vite build` before it.
      - name: Package
        run: pnpm package ${{ matrix.packageArgs }}
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 0

      # `bundle` scope: the native inventory, the launch, the renderer. The full
      # scope waits for a conversation, which needs an installed and
      # authenticated agent no runner has — confirmed by running the macOS
      # verifier with the CLIs hidden and watching it fail identically on a
      # bundle known to be good. This gates; a red here is real.
      #
      # Electron needs a display and a CI runner has none, so the Linux job goes
      # through `xvfb-run`. Without it the launch fails in a way that reads as a
      # broken bundle rather than a missing X server.
      - name: Verify the packaged bundle
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run --auto-servernum pnpm --filter @chorus/desktop run ${{ matrix.verify }}
          else
            pnpm --filter @chorus/desktop run ${{ matrix.verify }}
          fi
        shell: bash
        env:
          CHORUS_VERIFY_SCOPE: bundle

      # Every artifact this job produced, each checksummed. Still named rather
      # than globbed — a glob that matches nothing succeeds, and an empty upload
      # is the failure that looks like a pass — but a job may now name two, since
      # one Linux build emits an AppImage and a .deb together.
      - name: Checksum
        shell: bash
        run: |
          cd apps/desktop/release
          for name in "${{ matrix.artifact }}" "${{ matrix.extraArtifact }}"; do
            [ -z "$name" ] && continue
            if [ ! -f "$name" ]; then
              echo "::error::no artifact named $name"
              ls -la
              exit 1
            fi
            if command -v sha256sum >/dev/null; then
              sha256sum "$name" > "$name.sha256"
            else
              shasum -a 256 "$name" > "$name.sha256"
            fi
            cat "$name.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/release/${{ matrix.artifact }}
            apps/desktop/release/${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 7

      # A second upload rather than a wider path, so `if-no-files-found: error`
      # keeps its meaning for both. Skipped by jobs that name only one.
      - uses: actions/upload-artifact@v4
        if: matrix.extraArtifact != ''
        with:
          name: ${{ matrix.extraArtifact }}
          path: |
            apps/desktop/release/${{ matrix.extraArtifact }}
            apps/desktop/release/${{ matrix.extraArtifact }}.sha256
          if-no-files-found: error
          retention-days: 7

  vsix:
    name: VS Code extension (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        run: pnpm --filter @chorus/extension run package
      - name: Checksum
        shell: bash
        run: |
          cd apps/extension/dist
          name="chorus-${{ needs.gate.outputs.version }}-${{ matrix.target }}.vsix"
          if [ ! -f "$name" ]; then
            echo "::error::no artifact named $name"
            ls -la
            exit 1
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$name" > "$name.sha256"
          else
            shasum -a 256 "$name" > "$name.sha256"
          fi
          cat "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: chorus-${{ needs.gate.outputs.version }}-${{ matrix.target }}.vsix
          path: |
            apps/extension/dist/chorus-${{ needs.gate.outputs.version }}-${{ matrix.target }}.vsix
            apps/extension/dist/chorus-${{ needs.gate.outputs.version }}-${{ matrix.target }}.vsix.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    if: inputs.publish_to != ''
    needs: [gate, build, vsix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # The notes are the CHANGELOG section for this version, plus the two
      # paragraphs every release has to repeat because every downloader meets
      # one of them: Gatekeeper on macOS (C-002) and SmartScreen on Windows.
      - name: Assemble the notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ needs.gate.outputs.version }}"
          {
            awk -v v="## $VERSION" '
              $0 == v { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md
            cat <<'FOOTER'

          ---

          ### Installing

          **macOS** — the build is ad-hoc signed but not notarized, so Gatekeeper
          objects on first launch. Open it once with **right-click → Open**, or:

          ```sh
          xattr -dr com.apple.quarantine /Applications/Chorus.app
          ```

          [Installing Chorus on macOS](docs/install-macos.md) walks through every
          dialog, including the one that means something is actually wrong.

          **Windows** — the installer is not signed at all, so SmartScreen blocks
          it: choose **More info → Run anyway**. A signature alone would not fix
          that either, because SmartScreen scores reputation rather than validity
          and a new certificate has none.
          [Installing Chorus on Windows](docs/install-windows.md) has the rest,
          including how to verify the checksum published beside the installer.

          Requires the `claude` and `codex` CLIs already installed and logged in.
          Windows additionally needs Git for Windows.
          FOOTER
          } > notes.md
          echo "wrote $(wc -l < notes.md) lines of notes"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$PUBLISH_TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "Chorus ${{ needs.gate.outputs.version }}" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" assets/* --clobber

      # Verify against the API rather than the exit code: a `gh release upload`
      # that half-worked still exits zero, and the asset list is the only thing
      # that says what a person will actually be offered.
      - name: Verify the assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$PUBLISH_TAG"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"'
          # Counted per extension rather than as one total. A single total of
          # three passes when two DMGs shipped and the Windows job failed, which
          # is exactly the case this step exists to catch.
          count() {
            gh release view "$TAG" --json assets --jq "[.assets[] | select(.name|endswith(\"$1\"))] | length"
          }
          DMG=$(count .dmg); EXE=$(count .exe); APPIMAGE=$(count .AppImage); DEB=$(count .deb)
          VSIX=$(count .vsix)
          echo "found $DMG .dmg, $EXE .exe, $APPIMAGE .AppImage, $DEB .deb, $VSIX .vsix"
          if [ "$DMG" -ne 2 ] || [ "$EXE" -ne 1 ] || [ "$APPIMAGE" -ne 1 ] || [ "$DEB" -ne 1 ] || [ "$VSIX" -ne 4 ]; then
            echo "::error::expected 2 .dmg (arm64, x64), 1 .exe, 1 .AppImage, 1 .deb and 4 .vsix"
            exit 1
          fi
