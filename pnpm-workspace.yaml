packages:
  - 'apps/*'
  - 'packages/*'

# Postinstall scripts run arbitrary code, so they are opt-in one package at a
# time. Keeping this list short is the one-native-module budget from plan §4.4 —
# every entry here is another binary to sign if M9 ever triggers.
allowBuilds:
  esbuild: true
  electron: true
  better-sqlite3: true
  # The terminal's PTY. Its `install` script only *checks* that a prebuild for
  # this platform exists and exits 0 — it compiles nothing on a supported
  # target — so this entry is belt and braces rather than what produces the
  # binding. See docs/plans/a-terminal-in-every-session-2026-08-12/plan.md §3.
  node-pty: true
  # A Windows installer builder pulled in by electron-builder. macOS only for
  # v1.0 (plan §10), so it has nothing to do here.
  electron-winstaller: false

# The Claude Agent SDK ships its CLI as per-platform optional dependencies, and
# the darwin-arm64 one unpacks to ~257 MB. We drive the user's installed
# `claude` via pathToClaudeCodeExecutable instead (plan §2.5), so the bundled
# binary is dead weight in node_modules and in any future signed build.
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl'
  - '@anthropic-ai/claude-agent-sdk-linux-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64'
  - '@anthropic-ai/claude-agent-sdk-win32-x64'
