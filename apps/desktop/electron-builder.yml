# Packaging Chorus into something you can double-click.
#
# No Developer ID and no notarization yet: that is the M9 gate. So Gatekeeper
# will object on a machine that downloaded this, and the release notes say how
# to get past it rather than pretending it will not happen.
#
# It is still ad-hoc signed, which is a different thing and not optional. See
# `afterPack` below.
appId: dev.chorus.desktop
productName: Chorus
copyright: Chorus

# The scheme an OAuth callback comes home on.
#
# An extension builds its redirect URI from `vscode.env.uriScheme`, which is
# `productConfiguration.urlProtocol` in `services.ts` — `chorus`. This is what
# tells the OS that `chorus://` belongs to this bundle; without it the browser
# finishes authenticating and the return trip has nowhere to go, which is exactly
# how GitLab sign-in hung forever. `index.ts` handles the delivery.
#
# Registration happens at *install* time on macOS, from the bundle's
# `CFBundleURLTypes`, so a build that has never been installed will not answer a
# `chorus://` URL no matter what this file says.
protocols:
  - name: Chorus
    schemes:
      - chorus

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  # The workbench manifest, read from *inside the asar* at runtime:
  # `workbench-host.ts` resolves it as `app.getAppPath()/build/workbench-runtime.json`.
  #
  # It has to be named here, and the reason is not "files: is an allowlist".
  # electron-builder injects `!<buildResources>{,/**/*}` — literally `!build` here,
  # because `directories.buildResources` is `build` — at the *front* of the pattern
  # list. Its `minimatchAll` is order-dependent and skips a negation while nothing
  # has matched yet, so a positive pattern listed after it still wins. Without one,
  # nothing under `build/` matches anything and the manifest is simply never
  # collected.
  #
  # That shipped in 0.20.0 as `ENOENT, build/workbench-runtime.json not found in
  # app.asar` on every `workbench:open` — the editor never started in a packaged
  # build. `pnpm dev` was fine, because there `getAppPath()` is the source tree and
  # the file is right there. Nothing caught it: `e2e/packaged.mjs` reads the
  # manifest from the *checkout* (`APP` is `apps/desktop`), not from the bundle, so
  # the bundle-scope gate verified a file the app cannot see.
  - build/workbench-runtime.json
  # Bundled into out/ by electron-vite, so node_modules is mostly dead weight.
  # The three exceptions cannot be bundled: better-sqlite3 and node-pty are
  # native, and the Claude SDK resolves its own files at runtime.
  - '!node_modules/**'
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  # Debug symbols and the winpty source tree, neither of which ship.
  #
  # node-pty's win32 prebuilds carry a .pdb beside every binary — conpty,
  # conpty_console_list, pty and winpty-agent — which is ~28 MB, several times
  # the size of everything else in the installer. `deps/winpty/` is the
  # vendored C++ the prebuilds were built from and is equally dead weight.
  # Excluded here rather than in asarUnpack because they must not be collected
  # at all, not merely left outside the asar.
  - '!node_modules/node-pty/prebuilds/*/*.pdb'
  - '!node_modules/node-pty/deps/**'
  - '!node_modules/node-pty/src/**'
  - '!node_modules/node-pty/third_party/**'

# Do not let electron-builder rebuild native modules from source.
#
# Both native deps here ship N-API prebuilds that load in Electron unmodified,
# so a rebuild buys nothing and costs a toolchain. It is off explicitly rather
# than by luck: `@electron/rebuild` only recognises prebuilds published by
# `prebuildify` or `prebuild-install`, and node-pty uses neither — so with the
# default it would fall through to node-gyp and compile, silently making the
# packaged app load a different binary from `pnpm dev`.
npmRebuild: false

extraResources:
  # The remote extension host, so a first launch does not need the network.
  #
  # Staged by `beforePack` (`build/stage-reh.cjs`), which is handed the target
  # architecture and picks the matching archive out of the manifest. Shipped
  # under a fixed name because the source filename carries a platform, an
  # architecture and a release, and reconstructing that at runtime is three
  # chances to be wrong.
  #
  # R3 says this is affordable: 412.6 MB installed against a 949.6 MB ceiling,
  # measured on 2026-08-29 with `bf9c054` as the 316.5 MB baseline.
  - from: build/reh/workbench-server.tar.gz
    to: workbench-server.tar.gz
  - from: ../engine/dist/runtime
    to: engine
  - from: ../engine/dist/runtime/node_modules
    to: engine/node_modules

# Both ship N-API prebuilds, so nothing is compiled at pack time — but a .node
# cannot be dlopen'd from inside an asar, so they must stay outside it.
#
# node-pty additionally ships `spawn-helper`, a separate executable it execs at
# runtime. It resolves its own path across the asar boundary
# (`lib/unixTerminal.js` rewrites app.asar -> app.asar.unpacked), so unpacking is
# all that is needed here — but see `afterPack` for its permissions.
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**

# Windows: NSIS, x64, per-machine.
#
# `asInvoker` is deliberate and is what keeps ordinary use free of a UAC prompt.
# Nothing Chorus does needs administrator rights — it drives the user's own CLIs
# and writes under their profile — so requesting elevation would be asking for a
# privilege in order not to use it.
#
# `signExts` adds the two extensions electron-builder does not sign by default.
# `.node` is a DLL wearing another suffix (better-sqlite3 and node-pty both ship
# one) and `.dll` covers node-pty's winpty.dll, which arrives as a third-party
# prebuild rather than something built here.
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  signExts:
    - .dll
    - .node

nsis:
  # Assisted rather than one-click: a one-click installer gives the user no say
  # in scope or location and no visible record of what it did.
  oneClick: false
  # Per-machine, so an existing install is upgraded in place rather than joined.
  #
  # It was per-user, and the failure that changed it is not theoretical: a
  # machine already carrying a per-machine 0.20.0 at `C:\Program Files\Chorus`
  # would have gained a *second* Chorus under `%LOCALAPPDATA%\Programs`, two
  # Start Menu entries with one name, both reporting the same version, and
  # nothing to tell the running one from the new one.
  #
  # The cost is a UAC prompt at install time. `requestedExecutionLevel` above is
  # unchanged and still `asInvoker`, because that governs the *app*: elevating
  # the installer says nothing about what Chorus runs as afterwards.
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  # The event log is the source of truth and it lives in userData. An uninstall
  # that took it would destroy every transcript on the machine, which is not
  # something an uninstaller should decide on the user's behalf.
  deleteAppDataOnUninstall: false
  artifactName: Chorus-${version}-windows-${arch}-setup.${ext}

# macOS: both architectures, and they are two separate DMGs rather than a
# universal one.
#
# A universal binary would be one download that runs anywhere, and it was not
# chosen: it lipo's two copies of Electron into one bundle, so every user pays
# for the architecture they are not running — on a build whose installed size
# already has a pre-registered ceiling (preflight §8.5 R3, ≤ 3x the 133.8 MB
# arm64 baseline). Two named DMGs cost a choice on the download page instead,
# and `docs/install-macos.md` makes that choice for the reader.
#
# The REH is fetched per platform at runtime from the pinned manifest
# (`build/workbench-runtime.json`), which already carries `darwin-x64`, so an
# Intel build has a server to talk to without anything else changing here.
# No `arch:` here, and its absence is the load-bearing part.
#
# It read `arch: [arm64, x64]`, and a per-target arch list in the config **wins
# over the CLI flag** — so `pnpm package --arm64` built both architectures
# anyway. Measured, not inferred: the run that produced the R3 numbers was asked
# for arm64 and packaged `release/mac-arm64` and `release/mac` back to back.
#
# That made the release matrix's `packageArgs` inert. Every mac runner would
# have built both and taken twice as long, and the claim in `release.yml` that
# the flag prevents it was simply false.
#
# Omitted instead, so electron-builder targets the host architecture by default
# and `--arm64` / `--x64` actually select one. Each release job then builds only
# its own, on a runner of that architecture, which is what makes
# `verify:package` a native launch rather than a translated one.
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
  # No identity to sign with. This makes electron-builder skip signing
  # altogether, which `afterPack` then puts right.
  identity: null
  hardenedRuntime: false

# Ad-hoc sign the finished bundle.
#
# `identity: null` does not mean "sign ad-hoc", it means "do not sign", and what
# survives is the Electron binary's own linker signature: `Identifier=Electron`,
# `Sealed Resources=none`, and `codesign --verify` failing with "code has no
# resources but signature indicates they must be present".
#
# An app in that state, once a browser has quarantined it, is not merely
# untrusted — macOS calls it **damaged** and offers only "Move to Trash". No
# right-click → Open, no way through. Ad-hoc signing does not make Gatekeeper
# happy, but it does make the refusal an honest one the user can override.
# Ad-hoc signing is a macOS concept; the hook returns early on other platforms.
# Linux: AppImage and deb, x64 only.
#
# **It must be built on Linux, and that is not a preference.** `node-pty`
# publishes prebuilds for darwin and win32 and *none* for Linux — checked, not
# assumed — so its install script falls through to `node-gyp rebuild`. With
# `npmRebuild: false` set above, the binding that ships is whatever `pnpm
# install` produced on the build host, so cross-building from macOS would
# package a bundle with no PTY at all and no error saying so. The release
# workflow therefore runs this on `ubuntu-latest`.
#
# That also disposes of the spawn-helper repair on this platform: `lib/utils.js`
# prefers `build/Release`, where the linker sets the executable bit, so the
# 0644 tarball bug is a prebuild problem and a compiled Linux build never has it.
# `sign-adhoc.cjs` returns early off macOS.
#
# **arm64 is deliberately absent.** The plan's rule is "arm64 only if every
# native and REH artifact exists"; the REH artifact does exist (`linux-arm64` is
# in the manifest) but the native side would have to be compiled on an arm64
# Linux runner, and a cross-built one could not be launched by `verify:package`.
# It is a runner question, not an artifact question, and it is not answered here.
#
# AppImage because it runs without being installed, which is the closest Linux
# has to the DMG's "download and open"; deb because that is what a Debian or
# Ubuntu user expects to be offered beside it.
linux:
  # Explicit, because the default is derived from the package name and this one
  # is scoped: `@chorus/desktop` sanitises to `@chorusdesktop`, and
  # electron-builder refuses it — "contains characters that cannot be safely used
  # in file paths". macOS and Windows never noticed, since both take their
  # executable from `productName`.
  #
  # It is also the path `e2e/packaged-linux.mjs` looks for, so the two are one
  # decision rather than a convention the verifier has to guess.
  executableName: chorus
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Development
  synopsis: A development environment with coding agents in the same window
  artifactName: Chorus-${version}-linux-${arch}.${ext}

beforePack: build/stage-reh.cjs
afterPack: build/sign-adhoc.cjs

dmg:
  title: Chorus ${version}
  # Explicit, because the default omits the suffix for x64 and two DMGs that
  # differ only by architecture must not be able to collide on one name. This
  # keeps the arm64 name exactly as it was — `docs/install-macos.md` and the
  # preflight's size baseline both quote it — and gives x64 the matching one.
  artifactName: Chorus-${version}-${arch}.${ext}
