# Packaging Chorus into something you can double-click.
#
# No Developer ID and no notarization yet: that is the M9 gate. So Gatekeeper
# will object on a machine that downloaded this, and the release notes say how
# to get past it rather than pretending it will not happen.
#
# It is still ad-hoc signed, which is a different thing and not optional. See
# `afterPack` below.
appId: dev.chorus.desktop
productName: Chorus
copyright: Chorus

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  # Bundled into out/ by electron-vite, so node_modules is mostly dead weight.
  # The three exceptions cannot be bundled: better-sqlite3 and node-pty are
  # native, and the Claude SDK resolves its own files at runtime.
  - '!node_modules/**'
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk/**

# Do not let electron-builder rebuild native modules from source.
#
# Both native deps here ship N-API prebuilds that load in Electron unmodified,
# so a rebuild buys nothing and costs a toolchain. It is off explicitly rather
# than by luck: `@electron/rebuild` only recognises prebuilds published by
# `prebuildify` or `prebuild-install`, and node-pty uses neither — so with the
# default it would fall through to node-gyp and compile, silently making the
# packaged app load a different binary from `pnpm dev`.
npmRebuild: false

# The companion VS Code extension, shipped with the app so the two always speak
# the same protocol version. Outside the asar because `code --install-extension`
# needs a real path it can open, and an asar is not a directory.
extraResources:
  - from: ../vscode-extension/chorus-vscode.vsix
    to: chorus-vscode.vsix
  # What that archive's version is. Main reads it rather than assuming the
  # extension is versioned with the app — they are separate numbers, and
  # assuming otherwise offered an update that reinstalled the same build.
  - from: ../vscode-extension/chorus-vscode.vsix.version
    to: chorus-vscode.vsix.version

# Both ship N-API prebuilds, so nothing is compiled at pack time — but a .node
# cannot be dlopen'd from inside an asar, so they must stay outside it.
#
# node-pty additionally ships `spawn-helper`, a separate executable it execs at
# runtime. It resolves its own path across the asar boundary
# (`lib/unixTerminal.js` rewrites app.asar -> app.asar.unpacked), so unpacking is
# all that is needed here — but see `afterPack` for its permissions.
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
  # No identity to sign with. This makes electron-builder skip signing
  # altogether, which `afterPack` then puts right.
  identity: null
  hardenedRuntime: false

# Ad-hoc sign the finished bundle.
#
# `identity: null` does not mean "sign ad-hoc", it means "do not sign", and what
# survives is the Electron binary's own linker signature: `Identifier=Electron`,
# `Sealed Resources=none`, and `codesign --verify` failing with "code has no
# resources but signature indicates they must be present".
#
# An app in that state, once a browser has quarantined it, is not merely
# untrusted — macOS calls it **damaged** and offers only "Move to Trash". No
# right-click → Open, no way through. Ad-hoc signing does not make Gatekeeper
# happy, but it does make the refusal an honest one the user can override.
afterPack: build/sign-adhoc.cjs

dmg:
  title: Chorus ${version}
