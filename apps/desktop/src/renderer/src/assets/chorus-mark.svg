<?xml version="1.0" encoding="UTF-8"?>
<!--
  The Chorus mark: the O out of the CHORUS wordmark.

  The wordmark already had a mark in it — `ChorusLogo.tsx` splits the word so the
  O alone can carry a gradient from Codex's hue to Claude's, under the heading
  "three voices in one letter". This is that O on its own. Nothing new was
  invented, because an icon that disagrees with the masthead is a second identity
  to keep in sync.

  This one file is both roles. `index.html` loads it as the favicon, and
  `build/make-icon.mjs` rasterises it into `build/icon.icns` for the packager.
  What it replaced was the second identity described above and worth keeping as a
  warning: three overlapping Didone O's, left behind when the drawn wordmark was
  retired for reading as a masthead over a monospace transcript. It could not
  have become the app icon anyway — three thin overlapping serif O's are mush at
  16px, which is the size that decides an icon.

  Why an O and not an illustration: it has to survive 16px in ⌘-Tab. A heavy
  stroke around a large open counter is the shape that still reads there, and it
  is reconstructible as two nested contours and one linear gradient — which is
  why this file is drawn by hand rather than generated. Every number below is a
  decision, not a sample.

  ## The geometry

  Both contours are four cubic Béziers through the axis points, with the handle
  length set by K. At K = 0.5523 that construction is a circle; larger values push
  the corners outward, and 0.78 lands on a squarish letterform — subtle flat runs
  down the sides, firmly rounded corners. A true circle was wrong: it reads as a
  status indicator or a loading spinner, not as a glyph from a monospace face.

  The counter is the same construction at a smaller radius, and the two radii are
  chosen so the ring is 124 wide on both axes: 248 - 124 across, 268 - 144 down.
  That evenness is why the stroke needs no modulating to look right.

  ## The container

  macOS does not mask app icons the way iOS does, so the squircle is ours to
  draw. 824x824 inset in a 1024 canvas is Apple's grid; outside it is transparent
  so the Dock sees the rounded silhouette rather than a square tile.

  ## Colours

  #151321, #7fd1c1 and #e9a05c are the ground, codex and claude custom
  properties from styles.css, unchanged. The two hues are not decoration — they
  are how the app attributes who said what, so the icon makes the same statement
  the transcript does. The gradient angle matches the wordmark's 105deg: in CSS
  that is a direction vector of (sin105, -cos105), which is why the endpoints
  below sit left-and-high to right-and-low rather than on a diagonal.

  Those three properties are spelled here without the two leading dashes CSS
  gives them, because this file is parsed as XML and a doubled hyphen inside a
  comment is a parse error. It is not a quiet one either: the renderer throws the
  whole drawing away and draws an error page instead, which still rasterises to a
  valid PNG of the right size. `make-icon.mjs` checks for it.

  The nine stops are not decoration either, and they are not hand-picked. Two
  stops is what the wordmark uses and it is wrong at this size: interpolating
  #7fd1c1 to #e9a05c in sRGB sends chroma down to 0.057 at the midpoint, below
  BOTH endpoints (0.084 and 0.121), and the ring turns olive across its middle.
  These stops walk the same two colours through OKLCH instead, where chroma
  climbs monotonically, and the offsets are eased (smoothstep) so the crossover
  happens quickly through the middle — that keeps recognisable teal and amber at
  the two ends, which is the whole point of using the agents' colours at all.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
>
  <defs>
    <linearGradient
      id="voices"
      gradientUnits="userSpaceOnUse"
      x1="213.6"
      y1="432.1"
      x2="810.4"
      y2="591.9"
    >
      <stop offset="0" stop-color="#7fd1c1" />
      <stop offset="0.125" stop-color="#80d1bb" />
      <stop offset="0.25" stop-color="#87cfab" />
      <stop offset="0.375" stop-color="#97cb93" />
      <stop offset="0.5" stop-color="#aec377" />
      <stop offset="0.625" stop-color="#c7b861" />
      <stop offset="0.75" stop-color="#daac58" />
      <stop offset="0.875" stop-color="#e5a35a" />
      <stop offset="1" stop-color="#e9a05c" />
    </linearGradient>
  </defs>

  <!-- The tile. Transparent outside it, so the silhouette is the squircle. -->
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="#151321" />

  <!--
    Outer contour then counter, wound the same way; `evenodd` punches the hole so
    the dark centre is the tile showing through rather than a second fill to keep
    in step with it.
  -->
  <path
    fill-rule="evenodd"
    fill="url(#voices)"
    d="M 264 512
       C 264 302.96 318.56 244 512 244
       C 705.44 244 760 302.96 760 512
       C 760 721.04 705.44 780 512 780
       C 318.56 780 264 721.04 264 512
       Z
       M 388 512
       C 388 399.68 415.28 368 512 368
       C 608.72 368 636 399.68 636 512
       C 636 624.32 608.72 656 512 656
       C 415.28 656 388 624.32 388 512
       Z"
  />
</svg>
